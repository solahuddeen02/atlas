# Secrets come from an untracked .env file next to this file: cp .env.example .env
# and fill in every value. Never put secret values in this file.
services:
  atlas:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - atlas_data:/app/data
      - atlas_db:/app/db
    env_file: .env
    environment:
      - ATLAS_DATA_DIR=data
      - DATABASE_URL=sqlite:///./db/atlas.db
      - STORAGE_BACKEND=local
    depends_on:
      - minio

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"

volumes:
  atlas_data:
  atlas_db:
  minio_data: