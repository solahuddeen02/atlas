# Job ids are the status-check names used in branch protection. Keep them stable:
# backend, legacy, web, gitleaks, audit, compose-lint.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.24.3"
  GITLEAKS_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (from uv.lock)
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check
      - name: ruff format
        run: uv run ruff format --check
      - name: mypy --strict
        run: uv run mypy
      - name: import-linter
        run: uv run lint-imports
      - name: pytest
        run: uv run pytest

  legacy:
    name: legacy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: legacy/requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: pytest
        env:
          # Keep tests away from any real DB/data dir.
          DATABASE_URL: "sqlite:///./ci_test.db"
          ATLAS_DATA_DIR: "./ci_data"
        run: python -m pytest

  web:
    name: web
    runs-on: ubuntu-latest
    # web/ has no app until Phase 7; until then this builds the legacy frontend.
    defaults:
      run:
        working-directory: legacy/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: legacy/frontend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: Lint (informational for legacy)
        # Legacy code is frozen apart from security fixes, and has known lint errors.
        # Lint becomes blocking for web/ when the v1 SPA lands (Phase 7).
        continue-on-error: true
        run: npm run lint
      - name: Build
        run: npm run build

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          rm gitleaks.tgz
      - name: Scan new commits
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            ./gitleaks git --redact --no-banner --log-opts="${base}..HEAD" .
          else
            # New branch or unknown base: scan everything (the repo is small).
            ./gitleaks git --redact --no-banner .
          fi

  audit:
    name: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pip-audit (uv.lock)
        run: |
          uv export --frozen --all-groups --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run --locked pip-audit --strict --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: npm audit (legacy/frontend, runtime deps)
        working-directory: legacy/frontend
        run: npm audit --omit=dev
      - name: pip-audit (legacy, informational)
        # python-jose -> ecdsa has advisories with no fixed release. Legacy auth is
        # replaced in Phase 5 and not carried forward, so this only reports.
        continue-on-error: true
        run: uv run --locked pip-audit -r legacy/requirements.txt

  compose-lint:
    name: compose-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: No literal secrets in compose files (ADR-004 §3)
        run: uv run --locked python scripts/ci/lint_compose_secrets.py
