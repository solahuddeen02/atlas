version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /legacy
    schedule:
      interval: weekly
    # Legacy is frozen: security updates only.
    open-pull-requests-limit: 0

  - package-ecosystem: npm
    directory: /legacy/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
