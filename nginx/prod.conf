# Production — replace DOMAIN with your actual domain (e.g. myatlas.com)
# Requires wildcard SSL cert for *.DOMAIN
#
# Certbot wildcard (DNS challenge):
#   certbot certonly --manual --preferred-challenges dns -d DOMAIN -d *.DOMAIN

worker_processes auto;
events { worker_connections 1024; }

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;
    gzip         on;

    upstream backend { server 127.0.0.1:8000; }

    # Redirect HTTP → HTTPS
    server {
        listen 80;
        server_name DOMAIN *.DOMAIN;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name DOMAIN *.DOMAIN;

        ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        root  /var/www/atlas/dist;
        index index.html;

        # API endpoints → backend
        location ~ ^/(auth|admin|system|tenant|objects|drive|folders|photos|share|health) {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # SPA — serve index.html for everything else (same build, all subdomains)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
