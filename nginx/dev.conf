# Local development — atlas.local + subdomains
#
# Setup:
#   1. Add to C:\Windows\System32\drivers\etc\hosts (run as Admin):
#        127.0.0.1  atlas.local
#        127.0.0.1  drive.atlas.local
#        127.0.0.1  photos.atlas.local
#        127.0.0.1  admin.atlas.local
#
#   2. Start backend:  uvicorn core.main:app --reload
#   3. Start frontend: npm run dev -- --host
#   4. Start nginx:    nginx -c /path/to/nginx/dev.conf

worker_processes 1;
events { worker_connections 256; }

http {
    upstream backend  { server 127.0.0.1:8000; }
    upstream frontend { server 127.0.0.1:5173; }

    server {
        listen 80;
        server_name atlas.local *.atlas.local;

        # API — all requests starting with known API prefixes go to backend
        location ~ ^/(auth|admin|system|tenant|objects|drive|folders|photos|share|health) {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # Vite dev server (includes HMR websocket)
        location / {
            proxy_pass             http://frontend;
            proxy_set_header       Host              $host;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade           $http_upgrade;
            proxy_set_header       Connection        "upgrade";
        }
    }
}
