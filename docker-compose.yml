services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 5

  atlas:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - atlas_data:/app/data
    environment:
      - DATABASE_URL=postgresql://atlas:atlas@postgres:5432/atlas
      - ATLAS_DATA_DIR=data
      - SECRET_KEY=change-this-in-production
      - ATLAS_STORAGE_BACKEND=local
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  atlas_data:
  minio_data:
